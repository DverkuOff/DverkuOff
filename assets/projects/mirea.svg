<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="320" height="200">
  <rect width="320" height="200" fill="#FBF6EC" rx="8"/>

  <!-- LEFT: document being scanned -->
  <g transform="translate(20 28)">
    <rect x="0" y="0" width="100" height="124" rx="4" fill="#FFFCF6" stroke="#C46A52" stroke-width="1.4"/>
    <rect x="14" y="14" width="50" height="6" fill="#C46A52"/>
    <line x1="14" y1="32" x2="86" y2="32" stroke="#D9C9B0" stroke-width="2"/>
    <line x1="14" y1="46" x2="74" y2="46" stroke="#D9C9B0" stroke-width="2"/>
    <line x1="14" y1="60" x2="86" y2="60" stroke="#D9C9B0" stroke-width="2"/>
    <line x1="14" y1="74" x2="62" y2="74" stroke="#D9C9B0" stroke-width="2"/>
    <line x1="14" y1="88" x2="86" y2="88" stroke="#D9C9B0" stroke-width="2"/>
    <circle cx="76" cy="106" r="12" fill="none" stroke="#C46A52" stroke-width="1.4" opacity="0.55"/>

    <!-- scan line -->
    <line x1="0" y1="0" x2="100" y2="0" stroke="#C46A52" stroke-width="2.5" opacity="0.85">
      <animate attributeName="y1" values="6;124;6" keyTimes="0;0.7;1" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="y2" values="6;124;6" keyTimes="0;0.7;1" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.85;0.85;0" keyTimes="0;0.05;0.65;0.7" dur="4s" repeatCount="indefinite"/>
    </line>
    <!-- glow under scan -->
    <line x1="0" y1="0" x2="100" y2="0" stroke="#C46A52" stroke-width="6" opacity="0.18">
      <animate attributeName="y1" values="6;124;6" keyTimes="0;0.7;1" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="y2" values="6;124;6" keyTimes="0;0.7;1" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.18;0.18;0" keyTimes="0;0.05;0.65;0.7" dur="4s" repeatCount="indefinite"/>
    </line>
  </g>

  <!-- arrow / flow indicator -->
  <g stroke="#C46A52" stroke-width="1.2" fill="none" opacity="0.6">
    <line x1="128" y1="90" x2="158" y2="90" stroke-dasharray="3 3">
      <animate attributeName="stroke-dashoffset" from="0" to="-18" dur="1.4s" repeatCount="indefinite"/>
    </line>
    <polyline points="153,86 158,90 153,94" fill="none"/>
  </g>

  <!-- RIGHT: extracted data panel -->
  <g transform="translate(166 28)">
    <rect x="0" y="0" width="138" height="124" rx="6" fill="#FFFCF6" stroke="#E5D5BC" stroke-width="1.2"/>

    <!-- header -->
    <text x="12" y="20" font-family="Newsreader, Georgia, serif" font-style="italic" font-size="11" fill="#8C3A2C" font-weight="600">Распознано</text>
    <line x1="12" y1="26" x2="126" y2="26" stroke="#E5D5BC" stroke-width="1"/>
    <circle cx="120" cy="17" r="3" fill="#C46A52">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="1.4s" repeatCount="indefinite"/>
    </circle>

    <!-- field 1: Модель -->
    <g opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.13;0.18;0.85;0.9;1" dur="4s" repeatCount="indefinite"/>
      <g font-family="JetBrains Mono, monospace" font-size="9">
        <text x="12" y="42" fill="#8B8378">модель</text>
        <text x="126" y="42" fill="#2C2A26" text-anchor="end" font-weight="600">НП-3050</text>
      </g>
    </g>

    <!-- field 2: Серийный -->
    <g opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.28;0.33;0.85;0.9;1" dur="4s" repeatCount="indefinite"/>
      <g font-family="JetBrains Mono, monospace" font-size="9">
        <text x="12" y="60" fill="#8B8378">серийный №</text>
        <text x="126" y="60" fill="#2C2A26" text-anchor="end" font-weight="600">4521-A</text>
      </g>
    </g>

    <!-- field 3: Дата выпуска -->
    <g opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.43;0.48;0.85;0.9;1" dur="4s" repeatCount="indefinite"/>
      <g font-family="JetBrains Mono, monospace" font-size="9">
        <text x="12" y="78" fill="#8B8378">дата</text>
        <text x="126" y="78" fill="#2C2A26" text-anchor="end" font-weight="600">02.2024</text>
      </g>
    </g>

    <!-- field 4: Класс -->
    <g opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.58;0.63;0.85;0.9;1" dur="4s" repeatCount="indefinite"/>
      <g font-family="JetBrains Mono, monospace" font-size="9">
        <text x="12" y="96" fill="#8B8378">класс</text>
        <text x="126" y="96" fill="#2C2A26" text-anchor="end" font-weight="600">II</text>
      </g>
    </g>

    <!-- success state at end -->
    <g opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.65;0.7;0.85;0.9" dur="4s" repeatCount="indefinite"/>
      <line x1="12" y1="106" x2="126" y2="106" stroke="#E5D5BC" stroke-width="1"/>
      <circle cx="20" cy="115" r="3.5" fill="#7BAF6B"/>
      <text x="20" y="118" font-family="Inter, sans-serif" font-size="6" fill="#FFFFFF" text-anchor="middle" font-weight="700">✓</text>
      <text x="30" y="118" font-family="Newsreader, Georgia, serif" font-style="italic" font-size="9" fill="#5C8C5A">экспорт в XLSX</text>
    </g>
  </g>

  <text x="160" y="180" font-family="Newsreader, Georgia, serif" font-size="13" font-style="italic" fill="#8B8378" text-anchor="middle">PaddleOCR · OpenCV · поля в реальном времени</text>
</svg>
