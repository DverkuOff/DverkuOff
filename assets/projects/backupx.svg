<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="320" height="200">
  <defs>
    <linearGradient id="bxSweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="bxActiveClip">
      <rect x="0" y="0" width="180" height="22" rx="3"/>
    </clipPath>
  </defs>
  <rect width="320" height="200" fill="#FBF6EC" rx="8"/>
  <g transform="translate(70 36)">
    <g font-family="JetBrains Mono, monospace" font-size="9" fill="#8C3A2C">
      <g>
        <rect x="0" y="0" width="180" height="22" rx="3" fill="#FBF6EC" stroke="#C46A52" stroke-width="1.2"/>
        <circle cx="14" cy="11" r="3" fill="#7BAF6B">
          <animate attributeName="r" values="3;3.6;3" dur="2.6s" begin="0s" repeatCount="indefinite"/>
        </circle>
        <circle cx="14" cy="11" r="3" fill="none" stroke="#7BAF6B" stroke-width="0.8" opacity="0">
          <animate attributeName="r" values="3;7;3" dur="2.6s" repeatCount="indefinite"/>
          <animate attributeName="opacity" values="0.7;0;0.7" dur="2.6s" repeatCount="indefinite"/>
        </circle>
        <text x="26" y="14">snap-0245.tar.gz</text>
        <text x="156" y="14" text-anchor="end" fill="#8B8378">1.2 GB</text>
      </g>
      <g transform="translate(0 26)">
        <rect x="0" y="0" width="180" height="22" rx="3" fill="#FBF6EC" stroke="#C46A52" stroke-width="1.2"/>
        <circle cx="14" cy="11" r="3" fill="#7BAF6B">
          <animate attributeName="r" values="3;3.6;3" dur="2.6s" begin="0.6s" repeatCount="indefinite"/>
        </circle>
        <text x="26" y="14">snap-0244.tar.gz</text>
        <text x="156" y="14" text-anchor="end" fill="#8B8378">980 MB</text>
      </g>
      <g transform="translate(0 52)">
        <rect x="0" y="0" width="180" height="22" rx="3" fill="#FAEFE0" stroke="#C46A52" stroke-width="1.6">
          <animate attributeName="fill" values="#FAEFE0;#F5DCC4;#FAEFE0" dur="1.8s" repeatCount="indefinite"/>
        </rect>
        <!-- progress fill that grows from 0 to 67% -->
        <g clip-path="url(#bxActiveClip)">
          <rect x="0" y="0" width="0" height="22" fill="#F0CBB8" opacity="0.65">
            <animate attributeName="width" values="0;120.6;120.6" keyTimes="0;0.85;1" dur="3.6s" repeatCount="indefinite"/>
          </rect>
          <!-- traveling sheen across the active row -->
          <rect x="-30" y="0" width="50" height="22" fill="url(#bxSweep)" opacity="0.7">
            <animate attributeName="x" values="-50;180" dur="2.2s" repeatCount="indefinite"/>
          </rect>
        </g>
        <circle cx="14" cy="11" r="3.5" fill="#C46A52">
          <animate attributeName="r" values="3.5;5;3.5" dur="1.6s" repeatCount="indefinite"/>
        </circle>
        <circle cx="14" cy="11" r="3.5" fill="none" stroke="#C46A52" stroke-width="1" opacity="0">
          <animate attributeName="r" values="3.5;9;3.5" dur="2s" repeatCount="indefinite"/>
          <animate attributeName="opacity" values="0.7;0;0.7" dur="2s" repeatCount="indefinite"/>
        </circle>
        <text x="26" y="14" font-weight="700" fill="#8C3A2C">snap-0243.tar.gz</text>
        <text x="156" y="14" text-anchor="end" fill="#C46A52">
          <tspan>67%</tspan>
          <animate attributeName="opacity" values="1;0.5;1" dur="1.2s" repeatCount="indefinite"/>
        </text>
      </g>
      <g transform="translate(0 78)">
        <rect x="0" y="0" width="180" height="22" rx="3" fill="#FBF6EC" stroke="#C46A52" stroke-width="1.2"/>
        <circle cx="14" cy="11" r="3" fill="#7BAF6B">
          <animate attributeName="r" values="3;3.6;3" dur="2.6s" begin="1.2s" repeatCount="indefinite"/>
        </circle>
        <text x="26" y="14">snap-0242.tar.gz</text>
        <text x="156" y="14" text-anchor="end" fill="#8B8378">1.1 GB</text>
      </g>
    </g>

    <!-- queue indicator: small particle dot drifts down the left rail -->
    <circle cx="-8" cy="0" r="1.6" fill="#C46A52" opacity="0">
      <animate attributeName="cy" values="0;100" dur="3.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.85;0.85;0" keyTimes="0;0.1;0.85;1" dur="3.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="-8" cy="0" r="1.4" fill="#C46A52" opacity="0">
      <animate attributeName="cy" values="0;100" dur="3.4s" begin="1.1s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.7;0.7;0" keyTimes="0;0.1;0.85;1" dur="3.4s" begin="1.1s" repeatCount="indefinite"/>
    </circle>
  </g>
  <text x="160" y="180" font-family="Newsreader, Georgia, serif" font-size="13" font-style="italic" fill="#8B8378" text-anchor="middle">RabbitMQ · async · ack/retry</text>
</svg>
