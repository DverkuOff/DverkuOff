<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="320" height="200">
  <rect width="320" height="200" fill="#FBF6EC" rx="8"/>

  <defs>
    <!-- entry hop chain -->
    <path id="path-NL" d="M58 100 Q 110 95 145 90 Q 200 80 256 50" fill="none"/>
    <path id="path-DE" d="M58 100 Q 110 95 145 90 Q 200 90 256 80" fill="none"/>
    <path id="path-JP" d="M58 100 Q 110 105 145 110 Q 200 115 256 120" fill="none"/>
    <path id="path-US" d="M58 100 Q 110 105 145 110 Q 200 130 256 150" fill="none"/>
  </defs>

  <!-- relay hops (small dots) -->
  <g fill="#FBF6EC" stroke="#C46A52" stroke-width="1.6">
    <circle cx="105" cy="98" r="6"/>
    <circle cx="160" cy="100" r="6"/>
  </g>

  <!-- cascade lines -->
  <g stroke="#C46A52" stroke-width="1.6" fill="none" opacity="0.7">
    <use href="#path-NL"/>
    <use href="#path-DE"/>
    <use href="#path-JP"/>
    <use href="#path-US"/>
  </g>

  <!-- subtle dashed overlay on lines -->
  <g stroke="#C46A52" stroke-width="1.4" fill="none" opacity="0.35" stroke-dasharray="3 4">
    <use href="#path-NL">
      <animate attributeName="stroke-dashoffset" from="0" to="-21" dur="2s" repeatCount="indefinite"/>
    </use>
    <use href="#path-DE">
      <animate attributeName="stroke-dashoffset" from="0" to="-21" dur="2s" begin="0.3s" repeatCount="indefinite"/>
    </use>
    <use href="#path-JP">
      <animate attributeName="stroke-dashoffset" from="0" to="-21" dur="2s" begin="0.6s" repeatCount="indefinite"/>
    </use>
    <use href="#path-US">
      <animate attributeName="stroke-dashoffset" from="0" to="-21" dur="2s" begin="0.9s" repeatCount="indefinite"/>
    </use>
  </g>

  <!-- packets traveling each path -->
  <g fill="#C46A52">
    <circle r="3.5">
      <animateMotion dur="2.6s" repeatCount="indefinite"><mpath href="#path-NL"/></animateMotion>
    </circle>
    <circle r="3.5">
      <animateMotion dur="2.6s" begin="0.65s" repeatCount="indefinite"><mpath href="#path-DE"/></animateMotion>
    </circle>
    <circle r="3.5">
      <animateMotion dur="2.6s" begin="1.3s" repeatCount="indefinite"><mpath href="#path-JP"/></animateMotion>
    </circle>
    <circle r="3.5">
      <animateMotion dur="2.6s" begin="1.95s" repeatCount="indefinite"><mpath href="#path-US"/></animateMotion>
    </circle>
  </g>

  <!-- source RU node -->
  <g>
    <circle cx="38" cy="100" r="22" fill="#FBF6EC" stroke="#C46A52" stroke-width="1.8"/>
    <text x="38" y="104" font-family="JetBrains Mono, monospace" font-size="11" fill="#8C3A2C" text-anchor="middle" font-weight="700">RU</text>
  </g>

  <!-- destination nodes -->
  <g font-family="JetBrains Mono, monospace" font-size="9" fill="#FBF6EC" font-weight="700">
    <g>
      <circle cx="278" cy="48" r="14" fill="#C46A52" stroke="#8C3A2C" stroke-width="1.2"/>
      <text x="278" y="51" text-anchor="middle">NL</text>
    </g>
    <g>
      <circle cx="278" cy="78" r="14" fill="#C46A52" stroke="#8C3A2C" stroke-width="1.2"/>
      <text x="278" y="81" text-anchor="middle">DE</text>
    </g>
    <g>
      <circle cx="278" cy="118" r="14" fill="#C46A52" stroke="#8C3A2C" stroke-width="1.2"/>
      <text x="278" y="121" text-anchor="middle">JP</text>
    </g>
    <g>
      <circle cx="278" cy="148" r="14" fill="#C46A52" stroke="#8C3A2C" stroke-width="1.2"/>
      <text x="278" y="151" text-anchor="middle">US</text>
    </g>
  </g>

  <text x="160" y="180" font-family="Newsreader, Georgia, serif" font-size="13" font-style="italic" fill="#8B8378" text-anchor="middle">VLESS · Reality · multi-hop · Fake-TLS</text>
</svg>
