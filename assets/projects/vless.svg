<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="320" height="200">
  <rect width="320" height="200" fill="#FBF6EC" rx="8"/>

  <defs>
    <!-- full paths for packet animation: RU → hop1 → hop2 → endpoint -->
    <path id="path-NL" d="M 58 100 L 98 100 L 152 100 Q 200 80 240 56 L 264 50" fill="none"/>
    <path id="path-DE" d="M 58 100 L 98 100 L 152 100 Q 200 92 240 84 L 264 80" fill="none"/>
    <path id="path-JP" d="M 58 100 L 98 100 L 152 100 Q 200 108 240 116 L 264 120" fill="none"/>
    <path id="path-US" d="M 58 100 L 98 100 L 152 100 Q 200 120 240 144 L 264 150" fill="none"/>
  </defs>

  <!-- shared chain (RU → hop1 → hop2) -->
  <line x1="58" y1="100" x2="152" y2="100" stroke="#C46A52" stroke-width="2" opacity="0.85"/>

  <!-- branches from hop2 to endpoints -->
  <g stroke="#C46A52" stroke-width="1.6" fill="none" opacity="0.65">
    <path d="M 152 100 Q 200 80 240 56 L 264 50"/>
    <path d="M 152 100 Q 200 92 240 84 L 264 80"/>
    <path d="M 152 100 Q 200 108 240 116 L 264 120"/>
    <path d="M 152 100 Q 200 120 240 144 L 264 150"/>
  </g>

  <!-- dashed flow overlay on branches -->
  <g stroke="#C46A52" stroke-width="1.2" fill="none" opacity="0.4" stroke-dasharray="3 4">
    <path d="M 152 100 Q 200 80 240 56 L 264 50">
      <animate attributeName="stroke-dashoffset" from="0" to="-21" dur="2s" repeatCount="indefinite"/>
    </path>
    <path d="M 152 100 Q 200 92 240 84 L 264 80">
      <animate attributeName="stroke-dashoffset" from="0" to="-21" dur="2s" begin="0.3s" repeatCount="indefinite"/>
    </path>
    <path d="M 152 100 Q 200 108 240 116 L 264 120">
      <animate attributeName="stroke-dashoffset" from="0" to="-21" dur="2s" begin="0.6s" repeatCount="indefinite"/>
    </path>
    <path d="M 152 100 Q 200 120 240 144 L 264 150">
      <animate attributeName="stroke-dashoffset" from="0" to="-21" dur="2s" begin="0.9s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- hop nodes (filled, on the chain) -->
  <g>
    <circle cx="98" cy="100" r="5" fill="#C46A52"/>
    <circle cx="98" cy="100" r="9" fill="none" stroke="#C46A52" stroke-width="1" opacity="0">
      <animate attributeName="r" values="5;14;5" dur="2.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.45;0" dur="2.4s" repeatCount="indefinite"/>
    </circle>

    <circle cx="152" cy="100" r="5" fill="#C46A52"/>
    <circle cx="152" cy="100" r="9" fill="none" stroke="#C46A52" stroke-width="1" opacity="0">
      <animate attributeName="r" values="5;14;5" dur="2.4s" begin="0.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.45;0" dur="2.4s" begin="0.6s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- packets traveling (with trailing ghost copies for motion-blur feel) -->
  <g fill="#C46A52">
    <circle r="2" opacity="0.35">
      <animateMotion dur="2.8s" begin="-0.18s" repeatCount="indefinite"><mpath href="#path-NL"/></animateMotion>
    </circle>
    <circle r="2.6" opacity="0.6">
      <animateMotion dur="2.8s" begin="-0.09s" repeatCount="indefinite"><mpath href="#path-NL"/></animateMotion>
    </circle>
    <circle r="3.5">
      <animateMotion dur="2.8s" repeatCount="indefinite"><mpath href="#path-NL"/></animateMotion>
    </circle>

    <circle r="2" opacity="0.35">
      <animateMotion dur="2.8s" begin="0.52s" repeatCount="indefinite"><mpath href="#path-DE"/></animateMotion>
    </circle>
    <circle r="2.6" opacity="0.6">
      <animateMotion dur="2.8s" begin="0.61s" repeatCount="indefinite"><mpath href="#path-DE"/></animateMotion>
    </circle>
    <circle r="3.5">
      <animateMotion dur="2.8s" begin="0.7s" repeatCount="indefinite"><mpath href="#path-DE"/></animateMotion>
    </circle>

    <circle r="2" opacity="0.35">
      <animateMotion dur="2.8s" begin="1.22s" repeatCount="indefinite"><mpath href="#path-JP"/></animateMotion>
    </circle>
    <circle r="2.6" opacity="0.6">
      <animateMotion dur="2.8s" begin="1.31s" repeatCount="indefinite"><mpath href="#path-JP"/></animateMotion>
    </circle>
    <circle r="3.5">
      <animateMotion dur="2.8s" begin="1.4s" repeatCount="indefinite"><mpath href="#path-JP"/></animateMotion>
    </circle>

    <circle r="2" opacity="0.35">
      <animateMotion dur="2.8s" begin="1.92s" repeatCount="indefinite"><mpath href="#path-US"/></animateMotion>
    </circle>
    <circle r="2.6" opacity="0.6">
      <animateMotion dur="2.8s" begin="2.01s" repeatCount="indefinite"><mpath href="#path-US"/></animateMotion>
    </circle>
    <circle r="3.5">
      <animateMotion dur="2.8s" begin="2.1s" repeatCount="indefinite"><mpath href="#path-US"/></animateMotion>
    </circle>
  </g>

  <!-- source RU -->
  <g>
    <circle cx="36" cy="100" r="22" fill="none" stroke="#C46A52" stroke-width="1" opacity="0">
      <animate attributeName="r" values="22;36;22" dur="2.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0;0.5" dur="2.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="36" cy="100" r="22" fill="none" stroke="#C46A52" stroke-width="1" opacity="0">
      <animate attributeName="r" values="22;36;22" dur="2.8s" begin="0.9s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.4;0;0.4" dur="2.8s" begin="0.9s" repeatCount="indefinite"/>
    </circle>
    <circle cx="36" cy="100" r="22" fill="#FBF6EC" stroke="#C46A52" stroke-width="2"/>
    <text x="36" y="104" font-family="JetBrains Mono, monospace" font-size="11" fill="#8C3A2C" text-anchor="middle" font-weight="700">RU</text>
  </g>

  <!-- destination nodes (each gets an arrival flash ring) -->
  <g font-family="JetBrains Mono, monospace" font-size="9" fill="#FBF6EC" font-weight="700">
    <g>
      <circle cx="278" cy="50" r="14" fill="none" stroke="#C46A52" stroke-width="1.5" opacity="0">
        <animate attributeName="r" values="14;26;14" dur="2.8s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.9;0;0.9" dur="2.8s" repeatCount="indefinite"/>
      </circle>
      <circle cx="278" cy="50" r="14" fill="#C46A52" stroke="#8C3A2C" stroke-width="1.2">
        <animate attributeName="fill" values="#C46A52;#E89B7E;#C46A52" keyTimes="0;0.05;0.4" dur="2.8s" repeatCount="indefinite"/>
      </circle>
      <text x="278" y="53" text-anchor="middle">NL</text>
    </g>
    <g>
      <circle cx="278" cy="80" r="14" fill="none" stroke="#C46A52" stroke-width="1.5" opacity="0">
        <animate attributeName="r" values="14;26;14" dur="2.8s" begin="0.7s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.9;0;0.9" dur="2.8s" begin="0.7s" repeatCount="indefinite"/>
      </circle>
      <circle cx="278" cy="80" r="14" fill="#C46A52" stroke="#8C3A2C" stroke-width="1.2">
        <animate attributeName="fill" values="#C46A52;#E89B7E;#C46A52" keyTimes="0;0.05;0.4" dur="2.8s" begin="0.7s" repeatCount="indefinite"/>
      </circle>
      <text x="278" y="83" text-anchor="middle">DE</text>
    </g>
    <g>
      <circle cx="278" cy="120" r="14" fill="none" stroke="#C46A52" stroke-width="1.5" opacity="0">
        <animate attributeName="r" values="14;26;14" dur="2.8s" begin="1.4s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.9;0;0.9" dur="2.8s" begin="1.4s" repeatCount="indefinite"/>
      </circle>
      <circle cx="278" cy="120" r="14" fill="#C46A52" stroke="#8C3A2C" stroke-width="1.2">
        <animate attributeName="fill" values="#C46A52;#E89B7E;#C46A52" keyTimes="0;0.05;0.4" dur="2.8s" begin="1.4s" repeatCount="indefinite"/>
      </circle>
      <text x="278" y="123" text-anchor="middle">JP</text>
    </g>
    <g>
      <circle cx="278" cy="150" r="14" fill="none" stroke="#C46A52" stroke-width="1.5" opacity="0">
        <animate attributeName="r" values="14;26;14" dur="2.8s" begin="2.1s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.9;0;0.9" dur="2.8s" begin="2.1s" repeatCount="indefinite"/>
      </circle>
      <circle cx="278" cy="150" r="14" fill="#C46A52" stroke="#8C3A2C" stroke-width="1.2">
        <animate attributeName="fill" values="#C46A52;#E89B7E;#C46A52" keyTimes="0;0.05;0.4" dur="2.8s" begin="2.1s" repeatCount="indefinite"/>
      </circle>
      <text x="278" y="153" text-anchor="middle">US</text>
    </g>
  </g>

  <text x="160" y="184" font-family="Newsreader, Georgia, serif" font-size="13" font-style="italic" fill="#8B8378" text-anchor="middle">VLESS · Reality · multi-hop · Fake-TLS</text>
</svg>
