<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="320" height="200">
  <rect width="320" height="200" fill="#FBF6EC" rx="8"/>
  <defs>
    <path id="tunnelPath" d="M82 96 C 130 56, 190 136, 238 96"/>
  </defs>
  <g fill="none" stroke="#C46A52" stroke-width="1.8" stroke-linecap="round">
    <circle cx="60" cy="96" r="22" fill="#FBF6EC"/>
    <circle cx="260" cy="96" r="22" fill="#FBF6EC"/>
    <use href="#tunnelPath" stroke-width="2.2"/>
    <use href="#tunnelPath" opacity="0.4" stroke-dasharray="4 4">
      <animate attributeName="stroke-dashoffset" from="0" to="-32" dur="1.6s" repeatCount="indefinite"/>
    </use>
  </g>
  <g fill="#C46A52">
    <circle r="4">
      <animateMotion dur="2.4s" repeatCount="indefinite">
        <mpath href="#tunnelPath"/>
      </animateMotion>
    </circle>
    <circle r="3" opacity="0.7">
      <animateMotion dur="2.4s" begin="0.6s" repeatCount="indefinite">
        <mpath href="#tunnelPath"/>
      </animateMotion>
    </circle>
    <circle r="3" opacity="0.5">
      <animateMotion dur="2.4s" begin="1.2s" repeatCount="indefinite">
        <mpath href="#tunnelPath"/>
      </animateMotion>
    </circle>
  </g>
  <g font-family="JetBrains Mono, monospace" font-size="11" fill="#8C3A2C" text-anchor="middle" font-weight="600">
    <text x="60" y="100">RU</text>
    <text x="260" y="100">∞</text>
  </g>
  <text x="160" y="180" font-family="Newsreader, Georgia, serif" font-size="13" font-style="italic" fill="#8B8378" text-anchor="middle">VLESS · Reality · Fake-TLS</text>
</svg>
