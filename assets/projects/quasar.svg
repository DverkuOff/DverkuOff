<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="320" height="200">
  <defs>
    <linearGradient id="qBarFill" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#C46A52" stop-opacity="0"/>
      <stop offset="60%" stop-color="#C46A52" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#C46A52" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="320" height="200" fill="#FBF6EC" rx="8"/>
  <g transform="translate(110 36)" fill="none" stroke="#C46A52" stroke-width="1.6">
    <rect x="0" y="0" width="100" height="32" rx="4" fill="#FBF6EC"/>
    <rect x="0" y="42" width="100" height="32" rx="4" fill="#EEE6D3"/>
    <rect x="0" y="84" width="100" height="32" rx="4" fill="#FBF6EC"/>

    <!-- moving active-stage highlight ring -->
    <rect x="-2" y="-2" width="104" height="36" rx="6" fill="none" stroke="#8C3A2C" stroke-width="1.5" opacity="0">
      <animate attributeName="y" values="-2;40;82;-2" keyTimes="0;0.34;0.67;1" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.9;0.9;0;0;0.9;0.9;0;0;0.9;0.9;0" keyTimes="0;0.05;0.3;0.34;0.4;0.4;0.63;0.67;0.7;0.72;0.97;1" dur="6s" repeatCount="indefinite"/>
    </rect>

    <!-- per-stage sweep light (row 1) -->
    <rect x="0" y="0" width="100" height="32" rx="4" fill="url(#qBarFill)" opacity="0">
      <animate attributeName="opacity" values="0;1;0;0" keyTimes="0;0.15;0.3;1" dur="6s" repeatCount="indefinite"/>
    </rect>
    <!-- row 2 -->
    <rect x="0" y="42" width="100" height="32" rx="4" fill="url(#qBarFill)" opacity="0">
      <animate attributeName="opacity" values="0;0;1;0;0" keyTimes="0;0.34;0.5;0.66;1" dur="6s" repeatCount="indefinite"/>
    </rect>
    <!-- row 3 -->
    <rect x="0" y="84" width="100" height="32" rx="4" fill="url(#qBarFill)" opacity="0">
      <animate attributeName="opacity" values="0;0;0;1;0" keyTimes="0;0.66;0.7;0.85;1" dur="6s" repeatCount="indefinite"/>
    </rect>

    <line x1="14" y1="16" x2="74" y2="16"/>
    <line x1="14" y1="58" x2="74" y2="58"/>
    <line x1="14" y1="100" x2="74" y2="100"/>
    <circle cx="86" cy="16" r="3" fill="#C46A52">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="1.6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="86" cy="58" r="3" fill="#8C3A2C">
      <animate attributeName="opacity" values="1;0.4;1" dur="2.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="86" cy="100" r="3" fill="#7BAF6B">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="1.9s" begin="0.7s" repeatCount="indefinite"/>
    </circle>

    <!-- check marks far right of each row, fade in after stage activates -->
    <g stroke="#7BAF6B" stroke-width="1.4" stroke-linecap="round" fill="none">
      <path d="M104 15 L108 19 L114 11" opacity="0">
        <animate attributeName="opacity" values="0;0;1;1;1;0" keyTimes="0;0.3;0.34;0.95;0.98;1" dur="6s" repeatCount="indefinite"/>
      </path>
      <path d="M104 57 L108 61 L114 53" opacity="0">
        <animate attributeName="opacity" values="0;0;1;1;1;0" keyTimes="0;0.63;0.67;0.95;0.98;1" dur="6s" repeatCount="indefinite"/>
      </path>
    </g>
  </g>
  <path d="M40 96 Q70 76 90 96" fill="none" stroke="#C46A52" stroke-width="1.4" stroke-dasharray="3 3" opacity="0.65">
    <animate attributeName="stroke-dashoffset" from="0" to="-24" dur="1.8s" repeatCount="indefinite"/>
  </path>
  <path d="M230 96 Q260 116 280 96" fill="none" stroke="#C46A52" stroke-width="1.4" stroke-dasharray="3 3" opacity="0.65">
    <animate attributeName="stroke-dashoffset" from="0" to="24" dur="1.8s" repeatCount="indefinite"/>
  </path>
  <text x="160" y="180" font-family="Newsreader, Georgia, serif" font-size="13" font-style="italic" fill="#8B8378" text-anchor="middle">7-step deterministic pipeline</text>
</svg>
