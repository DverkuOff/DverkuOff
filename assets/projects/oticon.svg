<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="320" height="200">
  <defs>
    <path id="ot-line1" d="M74 62 L28 78"/>
    <path id="ot-line2" d="M74 62 L92 78"/>
    <path id="ot-line3" d="M74 62 L156 78"/>
    <radialGradient id="cloudGlow" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#C46A52" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#C46A52" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="320" height="200" fill="#FBF6EC" rx="8"/>
  <g transform="translate(60 42)">
    <!-- cloud halo (breathing) -->
    <ellipse cx="74" cy="40" rx="64" ry="34" fill="url(#cloudGlow)" opacity="0">
      <animate attributeName="opacity" values="0;0.85;0" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="rx" values="56;72;56" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="ry" values="30;42;30" dur="3.6s" repeatCount="indefinite"/>
    </ellipse>
    <path d="M40 36 C 30 16, 60 6, 70 18 C 80 6, 110 12, 110 32 C 130 32, 132 56, 116 60 L 36 60 C 20 60, 16 40, 40 36 Z" fill="#EEE6D3" stroke="#C46A52" stroke-width="1.6">
      <animate attributeName="opacity" values="0.85;1;0.85" dur="3s" repeatCount="indefinite"/>
    </path>
    <text x="74" y="48" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="11" fill="#8C3A2C" font-weight="600">cloud</text>
    <g transform="translate(0 78)" stroke="#C46A52" stroke-width="1.4" fill="none">
      <rect x="0" y="0" width="56" height="22" rx="3" fill="#FBF6EC"/>
      <text x="28" y="14" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="9" fill="#8C3A2C" stroke="none">terraform</text>
    </g>
    <g transform="translate(64 78)" stroke="#C46A52" stroke-width="1.4" fill="none">
      <rect x="0" y="0" width="56" height="22" rx="3" fill="#FBF6EC"/>
      <text x="28" y="14" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="9" fill="#8C3A2C" stroke="none">ansible</text>
    </g>
    <g transform="translate(128 78)" fill="#C46A52" stroke="none">
      <rect x="0" y="0" width="56" height="22" rx="3"/>
      <text x="28" y="14" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="9" fill="#FBF6EC">traefik</text>
    </g>
    <g stroke="#C46A52" stroke-width="1.2" stroke-dasharray="3 3" opacity="0.6">
      <line x1="74" y1="62" x2="28" y2="78">
        <animate attributeName="stroke-dashoffset" from="0" to="-18" dur="1.6s" repeatCount="indefinite"/>
      </line>
      <line x1="74" y1="62" x2="92" y2="78">
        <animate attributeName="stroke-dashoffset" from="0" to="-18" dur="1.6s" begin="0.2s" repeatCount="indefinite"/>
      </line>
      <line x1="74" y1="62" x2="156" y2="78">
        <animate attributeName="stroke-dashoffset" from="0" to="-18" dur="1.6s" begin="0.4s" repeatCount="indefinite"/>
      </line>
    </g>

    <!-- particles flowing down each deploy line -->
    <g fill="#C46A52">
      <circle r="2">
        <animateMotion dur="1.6s" repeatCount="indefinite"><mpath href="#ot-line1"/></animateMotion>
        <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.85;1" dur="1.6s" repeatCount="indefinite"/>
      </circle>
      <circle r="2">
        <animateMotion dur="1.6s" begin="0.2s" repeatCount="indefinite"><mpath href="#ot-line2"/></animateMotion>
        <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.85;1" dur="1.6s" begin="0.2s" repeatCount="indefinite"/>
      </circle>
      <circle r="2">
        <animateMotion dur="1.6s" begin="0.4s" repeatCount="indefinite"><mpath href="#ot-line3"/></animateMotion>
        <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.85;1" dur="1.6s" begin="0.4s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- traefik badge gentle bounce + halo -->
    <g transform="translate(128 78)">
      <rect x="-2" y="-2" width="60" height="26" rx="4" fill="none" stroke="#C46A52" stroke-width="1" opacity="0">
        <animate attributeName="opacity" values="0;0.8;0" dur="2.4s" repeatCount="indefinite"/>
        <animate attributeName="x" values="-1;-4;-1" dur="2.4s" repeatCount="indefinite"/>
        <animate attributeName="y" values="-1;-4;-1" dur="2.4s" repeatCount="indefinite"/>
        <animate attributeName="width" values="58;64;58" dur="2.4s" repeatCount="indefinite"/>
        <animate attributeName="height" values="24;30;24" dur="2.4s" repeatCount="indefinite"/>
      </rect>
    </g>
  </g>
  <text x="160" y="180" font-family="Newsreader, Georgia, serif" font-size="13" font-style="italic" fill="#8B8378" text-anchor="middle">infrastructure as code</text>
</svg>
