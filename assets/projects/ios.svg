<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="320" height="200">
  <defs>
    <radialGradient id="lockBg" cx="50%" cy="40%" r="80%">
      <stop offset="0%" stop-color="#FBF6EC"/>
      <stop offset="100%" stop-color="#E8DCC4"/>
    </radialGradient>
  </defs>

  <rect width="320" height="200" fill="url(#lockBg)" rx="8"/>

  <!-- Lock screen time -->
  <g text-anchor="middle" fill="#2C2A26">
    <text x="160" y="56" font-family="Inter, system-ui, sans-serif" font-size="40" font-weight="200" letter-spacing="-2">
      <animate attributeName="opacity" values="1;0.85;1" dur="6s" repeatCount="indefinite"/>
      9:41
    </text>
    <text x="160" y="74" font-family="Newsreader, Georgia, serif" font-style="italic" font-size="11" fill="#8B8378">среда · 10 мая</text>
  </g>


  <!-- Expanded Dynamic Island / Live Activity -->
  <g transform="translate(40 100)">
    <!-- soft halo around the island -->
    <rect x="-6" y="-6" width="252" height="60" rx="26" fill="none" stroke="#C46A52" stroke-width="0.8" opacity="0">
      <animate attributeName="opacity" values="0;0.55;0" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="x" values="-2;-10;-2" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="y" values="-2;-10;-2" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="width" values="244;260;244" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="height" values="52;68;52" dur="3.6s" repeatCount="indefinite"/>
    </rect>
    <rect width="240" height="48" rx="20" fill="#1A1A1A">
      <animate attributeName="fill" values="#1A1A1A;#252525;#1A1A1A" dur="3s" repeatCount="indefinite"/>
    </rect>
    <rect x="10" y="10" width="28" height="28" rx="7" fill="#C46A52"/>
    <text x="24" y="29" font-family="Newsreader, Georgia, serif" font-style="italic" font-size="16" fill="#FFFFFF" text-anchor="middle" font-weight="700">A</text>
    <text x="48" y="22" font-family="Inter, sans-serif" font-size="11" font-weight="700" fill="#FFFFFF">Поезд → Москва</text>
    <text x="48" y="36" font-family="Inter, sans-serif" font-size="9" fill="#A0A0A0">12 минут до прибытия</text>

    <!-- pulsing trail behind icon -->
    <circle cx="24" cy="24" r="14" fill="none" stroke="#C46A52" stroke-width="0.8" opacity="0">
      <animate attributeName="r" values="14;26;14" dur="2.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.5;0" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <!-- second ripple (offset) -->
    <circle cx="24" cy="24" r="14" fill="none" stroke="#C46A52" stroke-width="0.8" opacity="0">
      <animate attributeName="r" values="14;26;14" dur="2.4s" begin="1.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.4;0" dur="2.4s" begin="1.2s" repeatCount="indefinite"/>
    </circle>

    <!-- progress segment -->
    <rect x="190" y="20" width="38" height="4" rx="2" fill="#3A3A3A"/>
    <rect x="190" y="20" width="38" height="4" rx="2" fill="#C46A52">
      <animate attributeName="width" values="0;38;0" dur="4.8s" repeatCount="indefinite"/>
    </rect>
    <!-- small train dot riding the progress -->
    <circle cy="22" r="2.4" fill="#FBF6EC">
      <animate attributeName="cx" values="190;228;190" dur="4.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.05;0.95;1" dur="4.8s" repeatCount="indefinite"/>
    </circle>
    <text x="209" y="36" font-family="JetBrains Mono, monospace" font-size="8" fill="#C46A52" text-anchor="middle" font-weight="700">67%</text>
  </g>

  <!-- floating widget hint cards (each gently floats at slightly different phase) -->
  <g opacity="0.55">
    <g>
      <animateTransform attributeName="transform" type="translate" values="0,0; 0,-1.5; 0,0" dur="4.4s" repeatCount="indefinite"/>
      <rect x="38" y="166" width="32" height="22" rx="5" fill="#FBF6EC" stroke="#E5D5BC" stroke-width="1"/>
      <circle cx="46" cy="177" r="2.5" fill="#C46A52"/>
      <line x1="52" y1="174" x2="64" y2="174" stroke="#D9C9B0" stroke-width="1"/>
      <line x1="52" y1="180" x2="60" y2="180" stroke="#D9C9B0" stroke-width="1"/>
    </g>

    <g>
      <animateTransform attributeName="transform" type="translate" values="0,0; 0,-1.5; 0,0" dur="4.4s" begin="0.7s" repeatCount="indefinite"/>
      <rect x="78" y="166" width="32" height="22" rx="5" fill="#FBF6EC" stroke="#E5D5BC" stroke-width="1"/>
      <rect x="84" y="172" width="20" height="3" rx="1.5" fill="#7BAF6B">
        <animate attributeName="width" values="6;20;6" dur="3.6s" repeatCount="indefinite"/>
      </rect>
      <rect x="84" y="178" width="14" height="3" rx="1.5" fill="#D9C9B0"/>
    </g>

    <g>
      <animateTransform attributeName="transform" type="translate" values="0,0; 0,-1.5; 0,0" dur="4.4s" begin="1.4s" repeatCount="indefinite"/>
      <rect x="210" y="166" width="32" height="22" rx="5" fill="#FBF6EC" stroke="#E5D5BC" stroke-width="1"/>
      <text x="226" y="180" font-family="Newsreader, Georgia, serif" font-style="italic" font-size="11" fill="#8C3A2C" text-anchor="middle">A</text>
      <!-- notification badge -->
      <circle cx="238" cy="170" r="3" fill="#C46A52">
        <animate attributeName="opacity" values="0.6;1;0.6" dur="1.8s" repeatCount="indefinite"/>
      </circle>
    </g>

    <g>
      <animateTransform attributeName="transform" type="translate" values="0,0; 0,-1.5; 0,0" dur="4.4s" begin="2.1s" repeatCount="indefinite"/>
      <rect x="250" y="166" width="32" height="22" rx="5" fill="#FBF6EC" stroke="#E5D5BC" stroke-width="1"/>
      <circle cx="266" cy="177" r="3" fill="#C46A52" opacity="0.4">
        <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite"/>
      </circle>
      <circle cx="266" cy="177" r="3" fill="none" stroke="#C46A52" stroke-width="0.8" opacity="0">
        <animate attributeName="r" values="3;8;3" dur="2.4s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.5;0;0.5" dur="2.4s" repeatCount="indefinite"/>
      </circle>
    </g>
  </g>
</svg>
