<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="320" height="200">
  <rect width="320" height="200" fill="#FBF6EC" rx="8"/>

  <!-- ball trajectory path (invisible) -->
  <defs>
    <path id="ballRoute" d="M80,68 L160,68 L240,68 L240,128 L160,128 L80,128 L80,68" fill="none" stroke="none"/>
  </defs>

  <!-- connection wires (drawn UNDER boxes) -->
  <g stroke="#C46A52" stroke-width="1.5" fill="none" opacity="0.5">
    <line x1="100" y1="68" x2="140" y2="68"/>
    <line x1="180" y1="68" x2="220" y2="68"/>
    <line x1="100" y1="128" x2="140" y2="128"/>
    <line x1="180" y1="128" x2="220" y2="128"/>
    <line x1="80" y1="86" x2="80" y2="110"/>
    <line x1="160" y1="86" x2="160" y2="110"/>
    <line x1="240" y1="86" x2="240" y2="110"/>
  </g>

  <!-- moving message ball UNDER boxes for clean overlap -->
  <circle r="4" fill="#C46A52">
    <animateMotion dur="5s" repeatCount="indefinite" rotate="auto">
      <mpath href="#ballRoute"/>
    </animateMotion>
    <animate attributeName="opacity" values="1;1;1;0;1;1;1;1;0;1" keyTimes="0;0.15;0.18;0.2;0.22;0.48;0.51;0.53;0.55;0.57" dur="5s" repeatCount="indefinite"/>
  </circle>

  <!-- service boxes -->
  <g>
    <rect x="60" y="50" width="40" height="36" rx="4" fill="#C46A52"/>
    <text x="80" y="73" font-family="JetBrains Mono, monospace" font-size="9" fill="#FBF6EC" text-anchor="middle">bot</text>
  </g>
  <g>
    <rect x="140" y="50" width="40" height="36" rx="4" fill="#FBF6EC" stroke="#C46A52" stroke-width="1.5"/>
    <text x="160" y="73" font-family="JetBrains Mono, monospace" font-size="9" fill="#8C3A2C" text-anchor="middle">parser</text>
  </g>
  <g>
    <rect x="220" y="50" width="40" height="36" rx="4" fill="#2C2A26"/>
    <text x="240" y="73" font-family="Newsreader, Georgia, serif" font-style="italic" font-size="11" fill="#FBF6EC" text-anchor="middle">MQ</text>
  </g>
  <g>
    <rect x="60" y="110" width="40" height="36" rx="4" fill="#FBF6EC" stroke="#C46A52" stroke-width="1.5"/>
    <text x="80" y="133" font-family="JetBrains Mono, monospace" font-size="9" fill="#8C3A2C" text-anchor="middle">api</text>
  </g>
  <g>
    <rect x="140" y="110" width="40" height="36" rx="4" fill="#3B7BB7"/>
    <text x="160" y="133" font-family="JetBrains Mono, monospace" font-size="9" fill="#FBF6EC" text-anchor="middle">go</text>
  </g>
  <g>
    <rect x="220" y="110" width="40" height="36" rx="4" fill="#FBF6EC" stroke="#C46A52" stroke-width="1.5"/>
    <text x="240" y="133" font-family="JetBrains Mono, monospace" font-size="9" fill="#8C3A2C" text-anchor="middle">redis</text>
  </g>

  <text x="160" y="180" font-family="Newsreader, Georgia, serif" font-size="13" font-style="italic" fill="#8B8378" text-anchor="middle">9 микросервисов · MTProto · Go + Python</text>
</svg>
