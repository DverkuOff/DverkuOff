<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 440" width="640" height="440" text-rendering="geometricPrecision" shape-rendering="geometricPrecision">
  <rect width="640" height="440" fill="#FBF6EC" rx="16"/>

  <defs>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#1A1A1A" flood-opacity="0.10"/>
    </filter>
  </defs>

  <!-- Card -->
  <g filter="url(#cardShadow)">
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" begin="0.2s" dur="0.6s" fill="freeze"/>

      <rect x="40" y="36" width="560" height="320" rx="28" fill="#FFFCF6" stroke="#E5D5BC" stroke-width="2.4"/>

      <!-- header -->
      <g>
        <circle cx="84" cy="80" r="22" fill="#C46A52"/>
        <text x="84" y="88" font-family="Newsreader, Georgia, serif" font-style="italic" font-size="24" fill="#FBF6EC" text-anchor="middle" font-weight="700">A</text>
        <text x="120" y="76" font-family="Inter, system-ui, sans-serif" font-size="22" font-weight="700" fill="#2C2A26">ISA-Bot</text>
        <text x="120" y="100" font-family="Inter, system-ui, sans-serif" font-size="18" fill="#8B8378">@isa_parser_bot</text>

        <circle cx="480" cy="72" r="6" fill="#7BAF6B">
          <animate attributeName="opacity" values="0.4;1;0.4" dur="1.6s" repeatCount="indefinite"/>
        </circle>
        <text x="496" y="80" font-family="Inter, sans-serif" font-size="18" fill="#5C8C5A" font-weight="600">новое</text>
        <text x="560" y="104" font-family="Inter, sans-serif" font-size="16" fill="#8B8378" text-anchor="end">14:32</text>
      </g>

      <!-- divider -->
      <line x1="68" y1="128" x2="572" y2="128" stroke="#E5D5BC" stroke-width="2"/>

      <!-- listing body -->
      <g>
        <text x="80" y="184" font-family="Inter, system-ui, sans-serif" font-size="26" font-weight="700" fill="#2C2A26">iPhone 15 Pro Max</text>
        <text x="80" y="216" font-family="Inter, sans-serif" font-size="20" fill="#666">256 GB · Natural Titanium</text>
        <text x="80" y="244" font-family="Inter, sans-serif" font-size="20" fill="#666">Аккумулятор: 100%</text>
        <text x="80" y="272" font-family="Inter, sans-serif" font-size="20" fill="#666">Состояние: новый</text>

        <!-- price -->
        <text x="80" y="324" font-family="JetBrains Mono, monospace" font-size="38" font-weight="700" fill="#8C3A2C">89 990 ₽</text>

        <!-- location pill -->
        <rect x="400" y="296" width="156" height="40" rx="20" fill="#F5EBD8" stroke="#E5D5BC" stroke-width="1.6"/>
        <text x="478" y="322" font-family="Inter, sans-serif" font-size="20" fill="#8C3A2C" text-anchor="middle" font-weight="600">Москва</text>
      </g>
    </g>
  </g>

  <text x="320" y="400" font-family="Newsreader, Georgia, serif" font-size="26" font-style="italic" fill="#8B8378" text-anchor="middle">парсер 5 каналов · валидация · TG-уведомления</text>
</svg>
