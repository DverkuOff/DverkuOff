<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="320" height="200">
  <rect width="320" height="200" fill="#FBF6EC" rx="8"/>

  <defs>
    <path id="pipelinePath" d="M22 100 L298 100" fill="none" stroke="none"/>
    <marker id="arrowHead" viewBox="0 0 6 6" refX="5" refY="3" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#C46A52"/>
    </marker>
  </defs>

  <!-- connection lines between boxes -->
  <g stroke="#C46A52" stroke-width="1.4" fill="none" opacity="0.55">
    <line x1="22" y1="100" x2="35" y2="100"/>
    <line x1="79" y1="100" x2="89" y2="100" marker-end="url(#arrowHead)"/>
    <line x1="121" y1="100" x2="131" y2="100" marker-end="url(#arrowHead)"/>
    <line x1="189" y1="100" x2="199" y2="100" marker-end="url(#arrowHead)"/>
    <line x1="231" y1="100" x2="241" y2="100" marker-end="url(#arrowHead)"/>
    <line x1="291" y1="100" x2="304" y2="100" marker-end="url(#arrowHead)"/>
  </g>

  <!-- stations / boxes -->
  <g>
    <!-- parser -->
    <rect x="35" y="80" width="44" height="40" rx="6" fill="#C46A52"/>
    <text x="57" y="98" font-family="JetBrains Mono, monospace" font-size="9" fill="#FBF6EC" text-anchor="middle" font-weight="700">parser</text>
    <text x="57" y="112" font-family="Newsreader, Georgia, serif" font-style="italic" font-size="8" fill="#FBF6EC" text-anchor="middle" opacity="0.85">Telethon</text>

    <!-- MQ #1 -->
    <rect x="89" y="80" width="32" height="40" rx="6" fill="#2C2A26"/>
    <text x="105" y="106" font-family="Newsreader, Georgia, serif" font-style="italic" font-size="13" fill="#FBF6EC" text-anchor="middle" font-weight="600">MQ</text>

    <!-- validate -->
    <rect x="131" y="80" width="58" height="40" rx="6" fill="#FFFCF6" stroke="#C46A52" stroke-width="1.6"/>
    <text x="160" y="98" font-family="JetBrains Mono, monospace" font-size="9" fill="#8C3A2C" text-anchor="middle" font-weight="700">validate</text>
    <text x="160" y="112" font-family="Newsreader, Georgia, serif" font-style="italic" font-size="8" fill="#8B8378" text-anchor="middle">uniqueness</text>

    <!-- MQ #2 -->
    <rect x="199" y="80" width="32" height="40" rx="6" fill="#2C2A26"/>
    <text x="215" y="106" font-family="Newsreader, Georgia, serif" font-style="italic" font-size="13" fill="#FBF6EC" text-anchor="middle" font-weight="600">MQ</text>

    <!-- notifier -->
    <rect x="241" y="80" width="50" height="40" rx="6" fill="#3B7BB7"/>
    <text x="266" y="98" font-family="JetBrains Mono, monospace" font-size="9" fill="#FBF6EC" text-anchor="middle" font-weight="700">notifier</text>
    <text x="266" y="112" font-family="Newsreader, Georgia, serif" font-style="italic" font-size="8" fill="#FBF6EC" text-anchor="middle" opacity="0.85">Go</text>
  </g>

  <!-- moving packet dots -->
  <g>
    <circle r="3.5" fill="#FBF6EC" stroke="#C46A52" stroke-width="1.4">
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.04;0.96;1" dur="3.5s" repeatCount="indefinite"/>
      <animateMotion dur="3.5s" repeatCount="indefinite">
        <mpath href="#pipelinePath"/>
      </animateMotion>
    </circle>
    <circle r="3.5" fill="#FBF6EC" stroke="#C46A52" stroke-width="1.4">
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.04;0.96;1" dur="3.5s" begin="1.2s" repeatCount="indefinite"/>
      <animateMotion dur="3.5s" begin="1.2s" repeatCount="indefinite">
        <mpath href="#pipelinePath"/>
      </animateMotion>
    </circle>
    <circle r="3.5" fill="#FBF6EC" stroke="#C46A52" stroke-width="1.4">
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.04;0.96;1" dur="3.5s" begin="2.4s" repeatCount="indefinite"/>
      <animateMotion dur="3.5s" begin="2.4s" repeatCount="indefinite">
        <mpath href="#pipelinePath"/>
      </animateMotion>
    </circle>
  </g>

  <!-- top labels -->
  <g font-family="Newsreader, Georgia, serif" font-style="italic" font-size="11" fill="#8B8378">
    <text x="22" y="56">TG-каналы</text>
    <text x="298" y="56" text-anchor="end">подписчики</text>
  </g>
  <g stroke="#8B8378" stroke-width="0.8" opacity="0.4" stroke-dasharray="2 3">
    <line x1="62" y1="60" x2="62" y2="78"/>
    <line x1="266" y1="60" x2="266" y2="78"/>
  </g>

  <text x="160" y="180" font-family="Newsreader, Georgia, serif" font-size="13" font-style="italic" fill="#8B8378" text-anchor="middle">parser → RMQ → validate → RMQ → TG</text>
</svg>
