<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="320" height="200">
  <rect width="320" height="200" fill="#FBF6EC" rx="8"/>

  <defs>
    <path id="pipelineRoute" d="M14,100 L300,100" fill="none" stroke="none"/>
  </defs>

  <!-- source label -->
  <g font-family="Newsreader, Georgia, serif" font-style="italic" font-size="11" fill="#8B8378">
    <text x="6" y="80" text-anchor="start">TG-каналы</text>
  </g>

  <!-- pipeline arrows under boxes -->
  <g stroke="#C46A52" stroke-width="1.4" opacity="0.55" fill="none">
    <line x1="14" y1="100" x2="44" y2="100"/>
    <line x1="86" y1="100" x2="100" y2="100"/>
    <line x1="130" y1="100" x2="146" y2="100"/>
    <line x1="194" y1="100" x2="208" y2="100"/>
    <line x1="238" y1="100" x2="252" y2="100"/>
    <line x1="296" y1="100" x2="312" y2="100"/>
  </g>

  <!-- moving packet ball -->
  <circle r="3.5" fill="#C46A52">
    <animateMotion dur="4s" repeatCount="indefinite">
      <mpath href="#pipelineRoute"/>
    </animateMotion>
  </circle>

  <!-- 1. parser (Telethon, Python) -->
  <g>
    <rect x="44" y="82" width="42" height="36" rx="5" fill="#C46A52"/>
    <text x="65" y="100" font-family="JetBrains Mono, monospace" font-size="9" fill="#FBF6EC" text-anchor="middle" font-weight="600">parser</text>
    <text x="65" y="111" font-family="Newsreader, Georgia, serif" font-style="italic" font-size="7.5" fill="#FBF6EC" text-anchor="middle" opacity="0.85">Telethon</text>
  </g>

  <!-- 2. RMQ #1 -->
  <g>
    <rect x="100" y="82" width="30" height="36" rx="5" fill="#2C2A26"/>
    <text x="115" y="105" font-family="Newsreader, Georgia, serif" font-style="italic" font-size="11" fill="#FBF6EC" text-anchor="middle" font-weight="600">MQ</text>
  </g>

  <!-- 3. validate (uniqueness check) -->
  <g>
    <rect x="146" y="82" width="48" height="36" rx="5" fill="#FBF6EC" stroke="#C46A52" stroke-width="1.5"/>
    <text x="170" y="100" font-family="JetBrains Mono, monospace" font-size="9" fill="#8C3A2C" text-anchor="middle" font-weight="600">validate</text>
    <text x="170" y="111" font-family="Newsreader, Georgia, serif" font-style="italic" font-size="7.5" fill="#8B8378" text-anchor="middle">uniqueness</text>
  </g>

  <!-- 4. RMQ #2 -->
  <g>
    <rect x="208" y="82" width="30" height="36" rx="5" fill="#2C2A26"/>
    <text x="223" y="105" font-family="Newsreader, Georgia, serif" font-style="italic" font-size="11" fill="#FBF6EC" text-anchor="middle" font-weight="600">MQ</text>
  </g>

  <!-- 5. notifier (Go) -->
  <g>
    <rect x="252" y="82" width="44" height="36" rx="5" fill="#3B7BB7"/>
    <text x="274" y="100" font-family="JetBrains Mono, monospace" font-size="9" fill="#FBF6EC" text-anchor="middle" font-weight="600">notifier</text>
    <text x="274" y="111" font-family="Newsreader, Georgia, serif" font-style="italic" font-size="7.5" fill="#FBF6EC" text-anchor="middle" opacity="0.85">Go</text>
  </g>

  <!-- destination label -->
  <g font-family="Newsreader, Georgia, serif" font-style="italic" font-size="11" fill="#8B8378">
    <text x="314" y="80" text-anchor="end">подписчики</text>
  </g>

  <!-- subtle pulse rings on RMQ boxes when packet passes -->
  <circle cx="115" cy="100" r="0" fill="none" stroke="#C46A52" stroke-width="1.5" opacity="0">
    <animate attributeName="r" values="0;22;0" dur="4s" begin="0.7s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.6;0" dur="4s" begin="0.7s" repeatCount="indefinite"/>
  </circle>
  <circle cx="223" cy="100" r="0" fill="none" stroke="#C46A52" stroke-width="1.5" opacity="0">
    <animate attributeName="r" values="0;22;0" dur="4s" begin="2.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.6;0" dur="4s" begin="2.5s" repeatCount="indefinite"/>
  </circle>

  <text x="160" y="170" font-family="Newsreader, Georgia, serif" font-size="13" font-style="italic" fill="#8B8378" text-anchor="middle">parser → RMQ → validate → RMQ → TG</text>
</svg>
