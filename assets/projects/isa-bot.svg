<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 220" width="320" height="220">
  <rect width="320" height="220" fill="#FBF6EC" rx="8"/>

  <defs>
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5D4D8A"/>
      <stop offset="55%" stop-color="#C99B8E"/>
      <stop offset="100%" stop-color="#E5BAA0"/>
    </linearGradient>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#1A1A1A" flood-opacity="0.10"/>
    </filter>
  </defs>

  <!-- Card with entry animation -->
  <g filter="url(#cardShadow)">
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" begin="0.2s" dur="0.6s" fill="freeze"/>

      <!-- main message card -->
      <rect x="20" y="18" width="280" height="160" rx="14" fill="#FFFCF6" stroke="#E5D5BC" stroke-width="1.2"/>

      <!-- header: bot identity -->
      <g>
        <circle cx="42" cy="40" r="11" fill="#C46A52"/>
        <text x="42" y="44" font-family="Newsreader, Georgia, serif" font-style="italic" font-size="12" fill="#FBF6EC" text-anchor="middle" font-weight="700">A</text>
        <text x="60" y="38" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="700" fill="#2C2A26">ISA-Bot</text>
        <text x="60" y="50" font-family="Inter, system-ui, sans-serif" font-size="9" fill="#8B8378">@isa_parser_bot</text>

        <!-- "new" pulsing badge -->
        <circle cx="240" cy="36" r="3" fill="#7BAF6B">
          <animate attributeName="opacity" values="0.4;1;0.4" dur="1.6s" repeatCount="indefinite"/>
        </circle>
        <text x="248" y="40" font-family="Inter, sans-serif" font-size="9" fill="#5C8C5A" font-weight="600">новое</text>
        <text x="280" y="52" font-family="Inter, sans-serif" font-size="8" fill="#8B8378" text-anchor="end">14:32</text>
      </g>

      <!-- divider -->
      <line x1="34" y1="64" x2="286" y2="64" stroke="#E5D5BC" stroke-width="1"/>

      <!-- listing body -->
      <g>
        <text x="40" y="92" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700" fill="#2C2A26">iPhone 15 Pro Max</text>
        <text x="40" y="108" font-family="Inter, sans-serif" font-size="10" fill="#666">256 GB · Natural Titanium</text>
        <text x="40" y="122" font-family="Inter, sans-serif" font-size="10" fill="#666">Аккумулятор: 100%</text>
        <text x="40" y="136" font-family="Inter, sans-serif" font-size="10" fill="#666">Состояние: новый</text>

        <!-- price (big, terra) -->
        <text x="40" y="162" font-family="JetBrains Mono, monospace" font-size="19" font-weight="700" fill="#8C3A2C">89 990 ₽</text>

        <!-- location pill -->
        <rect x="200" y="148" width="78" height="20" rx="10" fill="#F5EBD8" stroke="#E5D5BC" stroke-width="0.8"/>
        <text x="239" y="161" font-family="Inter, sans-serif" font-size="10" fill="#8C3A2C" text-anchor="middle" font-weight="600">Москва</text>
      </g>
    </g>
  </g>

  <text x="160" y="200" font-family="Newsreader, Georgia, serif" font-size="13" font-style="italic" fill="#8B8378" text-anchor="middle">парсер 5 каналов · валидация · TG-уведомления</text>
</svg>
