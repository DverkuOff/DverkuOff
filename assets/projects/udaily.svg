  <!-- left-to-right wave sweep across the grid -->
  <g clip-path="url(#udGridClip)" opacity="0.7">
    <rect x="-30" y="38" width="44" height="96" fill="url(#udSweep)">
      <animate attributeName="x" values="-44;240" dur="5.6s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- "today" highlight ring orbiting a cell -->
  <g fill="none" stroke="#8C3A2C" stroke-width="1.4" opacity="0">
    <rect x="232" y="122" width="14" height="14" rx="3">
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.85;1" dur="3.4s" begin="0.6s" repeatCount="indefinite"/>
    </rect>
  </g>
  <!-- streak counter (in the right-margin space) -->
  <g transform="translate(278 80)">
    <circle r="14" fill="none" stroke="#C46A52" stroke-width="1" opacity="0">
      <animate attributeName="r" values="14;22;14" dur="2.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0;0.6" dur="2.6s" repeatCount="indefinite"/>
    </circle>
    <circle r="13" fill="#C46A52">
      <animate attributeName="r" values="12;14;12" dur="2.2s" repeatCount="indefinite"/>
    </circle>
