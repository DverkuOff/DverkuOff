<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <radialGradient id="accentGlow" cx="92%" cy="8%" r="70%">
      <stop offset="0%" stop-color="#C46A52" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#C46A52" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="800" fill="#FBF6EC" rx="14"/>
  <rect width="1200" height="800" fill="url(#accentGlow)" rx="14"/>

  <!-- header -->
  <g font-family="JetBrains Mono, monospace" font-size="16" fill="#8B8378" letter-spacing="3">
    <text x="60" y="58">02</text>
    <circle cx="98" cy="53" r="4" fill="#C46A52">
      <animate attributeName="r" values="3;5;3" dur="1.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.85;0.4;0.85" dur="1.8s" repeatCount="indefinite"/>
    </circle>
    <text x="115" y="58">СТЕК</text>
  </g>
  <text x="60" y="130" font-family="Newsreader, Georgia, serif" font-size="52" font-weight="400" letter-spacing="-1" fill="#2C2A26">
    Языки, базы данных и <tspan font-style="italic" fill="#8C3A2C">инструменты</tspan>.
  </text>
  <line x1="60" y1="158" x2="60" y2="158" stroke="#C46A52" stroke-width="2.5" stroke-linecap="round">
    <animate attributeName="x2" from="60" to="280" dur="1.4s" begin="0.2s" fill="freeze"/>
  </line>

  <!-- editor frame -->
  <rect x="60" y="200" width="1080" height="560" rx="12" fill="#FFFCF6" stroke="#E5D5BC" stroke-width="1.2"/>

  <!-- macOS window dots -->
  <g transform="translate(82 222)">
    <circle cx="0" cy="0" r="6.5" fill="#E89B7E"/>
    <circle cx="20" cy="0" r="6.5" fill="#E5C892"/>
    <circle cx="40" cy="0" r="6.5" fill="#A2C99B"/>
  </g>

  <!-- tabs -->
  <g font-family="JetBrains Mono, monospace" font-size="14" font-weight="500">
    <!-- stack.py tab -->
    <g>
      <rect x="160" y="208" width="130" height="34" rx="6" fill="#FBF6EC" stroke="#E5D5BC" stroke-width="1">
        <animate attributeName="fill" values="#FBF6EC;#FBF6EC;#F5EBD8;#F5EBD8;#FBF6EC" keyTimes="0;0.48;0.52;0.96;1" dur="14s" repeatCount="indefinite"/>
      </rect>
      <circle cx="178" cy="225" r="4" fill="#3776AB"/>
      <text x="190" y="229" fill="#2C2A26">stack.py</text>
      <rect x="160" y="240" width="130" height="2.5" fill="#C46A52">
        <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.48;0.52;0.96;1" dur="14s" repeatCount="indefinite"/>
      </rect>
    </g>
    <!-- stack.go tab -->
    <g>
      <rect x="296" y="208" width="130" height="34" rx="6" fill="#F5EBD8" stroke="#E5D5BC" stroke-width="1">
        <animate attributeName="fill" values="#F5EBD8;#F5EBD8;#FBF6EC;#FBF6EC;#F5EBD8" keyTimes="0;0.48;0.52;0.96;1" dur="14s" repeatCount="indefinite"/>
      </rect>
      <circle cx="314" cy="225" r="4" fill="#00ADD8"/>
      <text x="326" y="229" fill="#2C2A26">stack.go</text>
      <rect x="296" y="240" width="130" height="2.5" fill="#C46A52" opacity="0">
        <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.48;0.52;0.96;1" dur="14s" repeatCount="indefinite"/>
      </rect>
    </g>
  </g>

  <!-- editor body separator -->
  <line x1="60" y1="252" x2="1140" y2="252" stroke="#E5D5BC" stroke-width="1"/>

  <!-- line numbers -->
  <g font-family="JetBrains Mono, monospace" font-size="14" fill="#C2B49A" text-anchor="end">
    <text x="120" y="294">1</text>
    <text x="120" y="322">2</text>
    <text x="120" y="350">3</text>
    <text x="120" y="378">4</text>
    <text x="120" y="406">5</text>
    <text x="120" y="434">6</text>
    <text x="120" y="462">7</text>
    <text x="120" y="490">8</text>
    <text x="120" y="518">9</text>
    <text x="120" y="546">10</text>
    <text x="120" y="574">11</text>
  </g>

  <!-- PYTHON CODE — visible 0-7s, fades 7-8s -->
  <g font-family="JetBrains Mono, monospace" font-size="14">
    <g opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.014;0.07;0.49;0.555;1" dur="14s" repeatCount="indefinite"/>
      <text x="148" y="294"><tspan fill="#8C3A2C" font-weight="700">class </tspan><tspan fill="#2C2A26">DverkuOff</tspan><tspan fill="#8B8378">:</tspan></text>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.024;0.08;0.49;0.555;1" dur="14s" repeatCount="indefinite"/>
      <text x="148" y="322"><tspan fill="#2C2A26">    languages </tspan><tspan fill="#8B8378">= </tspan><tspan fill="#5C8C5A">[&quot;Python&quot;, &quot;Go&quot;, &quot;Swift&quot;, &quot;TypeScript&quot;, &quot;SQL&quot;, &quot;Bash&quot;]</tspan></text>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.034;0.09;0.49;0.555;1" dur="14s" repeatCount="indefinite"/>
      <text x="148" y="350"><tspan fill="#2C2A26">    databases </tspan><tspan fill="#8B8378">= </tspan><tspan fill="#5C8C5A">[&quot;PostgreSQL&quot;, &quot;Redis&quot;, &quot;MongoDB&quot;, &quot;Supabase&quot;, &quot;pgvector&quot;]</tspan></text>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.044;0.1;0.49;0.555;1" dur="14s" repeatCount="indefinite"/>
      <text x="148" y="378"><tspan fill="#2C2A26">    ai        </tspan><tspan fill="#8B8378">= </tspan><tspan fill="#5C8C5A">[&quot;OpenRouter&quot;, &quot;Anthropic&quot;, &quot;OpenAI&quot;, &quot;Ollama&quot;, &quot;ComfyUI&quot;, &quot;Whisper&quot;, &quot;n8n&quot;, &quot;MCP&quot;]</tspan></text>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.054;0.11;0.49;0.555;1" dur="14s" repeatCount="indefinite"/>
      <text x="148" y="406"><tspan fill="#2C2A26">    ai_coding </tspan><tspan fill="#8B8378">= </tspan><tspan fill="#5C8C5A">[&quot;Claude Code&quot;, &quot;Ruflo&quot;, &quot;Cursor&quot;, &quot;OpenDesign&quot;, &quot;Copilot&quot;, &quot;Figma&quot;]</tspan></text>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.064;0.12;0.49;0.555;1" dur="14s" repeatCount="indefinite"/>
      <text x="148" y="434"><tspan fill="#2C2A26">    devops    </tspan><tspan fill="#8B8378">= </tspan><tspan fill="#5C8C5A">[&quot;Docker&quot;, &quot;Ansible&quot;, &quot;Terraform&quot;, &quot;Nginx&quot;, &quot;Traefik&quot;, &quot;GH Actions&quot;, &quot;Linux&quot;]</tspan></text>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.074;0.13;0.49;0.555;1" dur="14s" repeatCount="indefinite"/>
      <text x="148" y="462"><tspan fill="#2C2A26">    observe   </tspan><tspan fill="#8B8378">= </tspan><tspan fill="#5C8C5A">[&quot;Grafana&quot;, &quot;Prometheus&quot;, &quot;Loki&quot;, &quot;ELK&quot;, &quot;RabbitMQ&quot;, &quot;Kafka&quot;]</tspan></text>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.084;0.14;0.49;0.555;1" dur="14s" repeatCount="indefinite"/>
      <text x="148" y="490"><tspan fill="#2C2A26">    vpn       </tspan><tspan fill="#8B8378">= </tspan><tspan fill="#5C8C5A">[&quot;VLESS&quot;, &quot;Xray&quot;, &quot;3x-ui&quot;, &quot;Reality&quot;, &quot;MTProto Fake-TLS&quot;]</tspan></text>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.094;0.15;0.49;0.555;1" dur="14s" repeatCount="indefinite"/>
      <text x="148" y="518"><tspan fill="#2C2A26">    cloud     </tspan><tspan fill="#8B8378">= </tspan><tspan fill="#5C8C5A">[&quot;Yandex Cloud&quot;, &quot;Timeweb Cloud&quot;, &quot;VPS / bare-metal&quot;]</tspan></text>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.104;0.16;0.49;0.555;1" dur="14s" repeatCount="indefinite"/>
      <text x="148" y="546"><tspan fill="#2C2A26">    payments  </tspan><tspan fill="#8B8378">= </tspan><tspan fill="#5C8C5A">[&quot;YooKassa&quot;, &quot;Telegram Stars&quot;, &quot;CryptoBot&quot;]</tspan></text>
    </g>
  </g>

  <!-- GO CODE — visible 8-13s -->
  <g font-family="JetBrains Mono, monospace" font-size="14">
    <g opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.555;0.61;0.96;0.99;1" dur="14s" repeatCount="indefinite"/>
      <text x="148" y="294"><tspan fill="#8C3A2C" font-weight="700">type </tspan><tspan fill="#2C2A26">DverkuOff </tspan><tspan fill="#8C3A2C" font-weight="700">struct </tspan><tspan fill="#8B8378">{</tspan></text>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.565;0.62;0.96;0.99;1" dur="14s" repeatCount="indefinite"/>
      <text x="148" y="322"><tspan fill="#2C2A26">    Languages </tspan><tspan fill="#8C3A2C">[]string  </tspan><tspan fill="#8B8378">// Python, Go, Swift, TypeScript, SQL, Bash</tspan></text>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.575;0.63;0.96;0.99;1" dur="14s" repeatCount="indefinite"/>
      <text x="148" y="350"><tspan fill="#2C2A26">    Databases </tspan><tspan fill="#8C3A2C">[]string  </tspan><tspan fill="#8B8378">// PostgreSQL, Redis, MongoDB, Supabase, pgvector</tspan></text>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.585;0.64;0.96;0.99;1" dur="14s" repeatCount="indefinite"/>
      <text x="148" y="378"><tspan fill="#2C2A26">    AI        </tspan><tspan fill="#8C3A2C">[]string  </tspan><tspan fill="#8B8378">// OpenRouter, Anthropic, OpenAI, Ollama, ComfyUI, Whisper, n8n, MCP</tspan></text>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.595;0.65;0.96;0.99;1" dur="14s" repeatCount="indefinite"/>
      <text x="148" y="406"><tspan fill="#2C2A26">    AICoding  </tspan><tspan fill="#8C3A2C">[]string  </tspan><tspan fill="#8B8378">// Claude Code, Ruflo, Cursor, OpenDesign, Copilot, Figma</tspan></text>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.605;0.66;0.96;0.99;1" dur="14s" repeatCount="indefinite"/>
      <text x="148" y="434"><tspan fill="#2C2A26">    DevOps    </tspan><tspan fill="#8C3A2C">[]string  </tspan><tspan fill="#8B8378">// Docker, Ansible, Terraform, Nginx, Traefik, GH Actions, Linux</tspan></text>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.615;0.67;0.96;0.99;1" dur="14s" repeatCount="indefinite"/>
      <text x="148" y="462"><tspan fill="#2C2A26">    Observe   </tspan><tspan fill="#8C3A2C">[]string  </tspan><tspan fill="#8B8378">// Grafana, Prometheus, Loki, ELK, RabbitMQ, Kafka</tspan></text>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.625;0.68;0.96;0.99;1" dur="14s" repeatCount="indefinite"/>
      <text x="148" y="490"><tspan fill="#2C2A26">    VPN       </tspan><tspan fill="#8C3A2C">[]string  </tspan><tspan fill="#8B8378">// VLESS, Xray, 3x-ui, Reality, MTProto Fake-TLS</tspan></text>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.635;0.69;0.96;0.99;1" dur="14s" repeatCount="indefinite"/>
      <text x="148" y="518"><tspan fill="#2C2A26">    Cloud     </tspan><tspan fill="#8C3A2C">[]string  </tspan><tspan fill="#8B8378">// Yandex Cloud, Timeweb Cloud, VPS / bare-metal</tspan></text>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.645;0.7;0.96;0.99;1" dur="14s" repeatCount="indefinite"/>
      <text x="148" y="546"><tspan fill="#2C2A26">    Payments  </tspan><tspan fill="#8C3A2C">[]string  </tspan><tspan fill="#8B8378">// YooKassa, Telegram Stars, CryptoBot</tspan></text>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.655;0.71;0.96;0.99;1" dur="14s" repeatCount="indefinite"/>
      <text x="148" y="574"><tspan fill="#8B8378">}</tspan></text>
    </g>
  </g>

  <!-- blinking cursor (stationary at bottom of code area) -->
  <rect x="148" y="588" width="2" height="18" fill="#C46A52" opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;1;0" keyTimes="0;0.16;0.2;0.45;0.55;1" dur="14s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.3;1;0.3" dur="1s" begin="3s" end="7s" repeatCount="4"/>
    <animate attributeName="opacity" values="0.3;1;0.3" dur="1s" begin="11s" end="13.5s" repeatCount="3"/>
  </rect>
  <rect x="148" y="588" width="2" height="18" fill="#C46A52" opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;1;0" keyTimes="0;0.7;0.74;0.92;0.96;1" dur="14s" repeatCount="indefinite"/>
  </rect>

  <!-- status bar at bottom -->
  <rect x="60" y="730" width="1080" height="30" fill="#F5EBD8"/>
  <line x1="60" y1="730" x2="1140" y2="730" stroke="#E5D5BC" stroke-width="1"/>
  <g font-family="JetBrains Mono, monospace" font-size="12" fill="#8B8378">
    <text x="84" y="750">
      <animate attributeName="fill" values="#3776AB;#3776AB;#00ADD8;#00ADD8;#3776AB" keyTimes="0;0.48;0.52;0.96;1" dur="14s" repeatCount="indefinite"/>
      <tspan>● </tspan>
      <tspan>
        <animate attributeName="fill" values="#8B8378;#8B8378;#8B8378;#8B8378;#8B8378" keyTimes="0;0.48;0.52;0.96;1" dur="14s" repeatCount="indefinite"/>
        Python 3.13
        <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.48;0.52;0.96;1" dur="14s" repeatCount="indefinite"/>
      </tspan>
    </text>
    <text x="84" y="750" opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.48;0.52;0.96;1" dur="14s" repeatCount="indefinite"/>
      <tspan fill="#00ADD8">● </tspan><tspan fill="#8B8378">Go 1.25</tspan>
    </text>
    <text x="1116" y="750" text-anchor="end">UTF-8 · LF</text>
  </g>
</svg>
