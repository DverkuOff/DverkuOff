<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 920" width="1200" height="920">
  <defs>
    <radialGradient id="accentGlow" cx="92%" cy="8%" r="70%">
      <stop offset="0%" stop-color="#C46A52" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#C46A52" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="scanLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C46A52" stop-opacity="0"/>
      <stop offset="50%" stop-color="#C46A52" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#C46A52" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="920" fill="#FBF6EC" rx="14"/>
  <rect width="1200" height="920" fill="url(#accentGlow)" rx="14"/>

  <!-- header eyebrow with pulsing dot -->
  <g font-family="JetBrains Mono, ui-monospace, monospace" font-size="16" fill="#8B8378" letter-spacing="3">
    <text x="60" y="60">02</text>
    <circle cx="98" cy="55" r="4" fill="#C46A52">
      <animate attributeName="r" values="3;5;3" dur="1.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.85;0.4;0.85" dur="1.8s" repeatCount="indefinite"/>
    </circle>
    <text x="115" y="60">СТЕК</text>
  </g>

  <!-- big serif title -->
  <text x="60" y="138" font-family="Newsreader, Georgia, serif" font-size="56" font-weight="400" letter-spacing="-1" fill="#2C2A26">
    Языки, базы данных и <tspan font-style="italic" fill="#8C3A2C">инструменты</tspan>.
  </text>

  <!-- title underline animated -->
  <line x1="60" y1="170" x2="60" y2="170" stroke="#C46A52" stroke-width="2.5" stroke-linecap="round">
    <animate attributeName="x2" from="60" to="280" dur="1.4s" begin="0.2s" fill="freeze"/>
  </line>

  <!-- top divider -->
  <line x1="60" y1="200" x2="1140" y2="200" stroke="#E5D5BC" stroke-width="1"/>

  <!-- ROWS — sequential fade-in -->
  <g font-family="Newsreader, Georgia, serif" font-style="italic" font-size="26" fill="#8C3A2C" font-weight="500">
    <g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="0.4s" dur="0.5s" fill="freeze"/>
      <text x="60" y="248">Языки</text>
    </g>
    <g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="0.55s" dur="0.5s" fill="freeze"/>
      <text x="60" y="318">Базы данных</text>
    </g>
    <g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="0.7s" dur="0.5s" fill="freeze"/>
      <text x="60" y="388">AI · Автоматизация</text>
    </g>
    <g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="0.85s" dur="0.5s" fill="freeze"/>
      <text x="60" y="458">AI-coding</text>
    </g>
    <g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="1s" dur="0.5s" fill="freeze"/>
      <text x="60" y="528">DevOps · Infra</text>
    </g>
    <g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="1.15s" dur="0.5s" fill="freeze"/>
      <text x="60" y="598">Observability</text>
    </g>
    <g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="1.3s" dur="0.5s" fill="freeze"/>
      <text x="60" y="668">VPN · Proxy</text>
    </g>
    <g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="1.45s" dur="0.5s" fill="freeze"/>
      <text x="60" y="738">Cloud</text>
    </g>
    <g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="1.6s" dur="0.5s" fill="freeze"/>
      <text x="60" y="808">Payments</text>
    </g>
  </g>

  <g font-family="JetBrains Mono, ui-monospace, monospace" font-size="17" fill="#2C2A26">
    <g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="0.5s" dur="0.6s" fill="freeze"/>
      <text x="380" y="248">Python &#x00B7; Go &#x00B7; Swift &#x00B7; TypeScript &#x00B7; SQL &#x00B7; Bash</text>
    </g>
    <g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="0.65s" dur="0.6s" fill="freeze"/>
      <text x="380" y="318">PostgreSQL &#x00B7; Redis &#x00B7; MongoDB &#x00B7; Supabase &#x00B7; pgvector</text>
    </g>
    <g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="0.8s" dur="0.6s" fill="freeze"/>
      <text x="380" y="388">OpenRouter &#x00B7; Anthropic &#x00B7; OpenAI &#x00B7; Ollama &#x00B7; ComfyUI &#x00B7; Whisper &#x00B7; n8n &#x00B7; MCP</text>
    </g>
    <g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="0.95s" dur="0.6s" fill="freeze"/>
      <text x="380" y="458">Claude Code &#x00B7; Ruflo &#x00B7; Cursor &#x00B7; OpenDesign &#x00B7; Copilot &#x00B7; Figma</text>
    </g>
    <g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="1.1s" dur="0.6s" fill="freeze"/>
      <text x="380" y="528">Docker &#x00B7; Ansible &#x00B7; Terraform &#x00B7; Nginx &#x00B7; Traefik &#x00B7; GH Actions &#x00B7; Linux &#x00B7; Cloudflare</text>
    </g>
    <g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="1.25s" dur="0.6s" fill="freeze"/>
      <text x="380" y="598">Grafana &#x00B7; Prometheus &#x00B7; Loki &#x00B7; ELK &#x00B7; RabbitMQ &#x00B7; Kafka</text>
    </g>
    <g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="1.4s" dur="0.6s" fill="freeze"/>
      <text x="380" y="668">VLESS &#x00B7; Xray &#x00B7; 3x-ui &#x00B7; Reality &#x00B7; MTProto Fake-TLS</text>
    </g>
    <g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="1.55s" dur="0.6s" fill="freeze"/>
      <text x="380" y="738">Yandex Cloud &#x00B7; Timeweb Cloud &#x00B7; VPS / bare-metal</text>
    </g>
    <g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="1.7s" dur="0.6s" fill="freeze"/>
      <text x="380" y="808">YooKassa &#x00B7; Telegram Stars &#x00B7; CryptoBot</text>
    </g>
  </g>

  <!-- subtle row dividers -->
  <g stroke="#E5D5BC" stroke-width="0.7" opacity="0.55">
    <line x1="60" y1="270" x2="1140" y2="270"/>
    <line x1="60" y1="340" x2="1140" y2="340"/>
    <line x1="60" y1="410" x2="1140" y2="410"/>
    <line x1="60" y1="480" x2="1140" y2="480"/>
    <line x1="60" y1="550" x2="1140" y2="550"/>
    <line x1="60" y1="620" x2="1140" y2="620"/>
    <line x1="60" y1="690" x2="1140" y2="690"/>
    <line x1="60" y1="760" x2="1140" y2="760"/>
  </g>

  <!-- continuous scan-line traversing from top to bottom -->
  <rect x="60" y="200" width="1080" height="3" fill="url(#scanLine)" opacity="0">
    <animate attributeName="y" values="210;830;210" dur="8s" begin="2.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.7;0.7;0" keyTimes="0;0.05;0.95;1" dur="8s" begin="2.5s" repeatCount="indefinite"/>
  </rect>
</svg>
